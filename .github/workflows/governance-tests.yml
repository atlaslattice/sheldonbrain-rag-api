name: Governance Contract Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  governance-tests:
    name: Verify governed-memory invariants
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run governance contract tests
        env:
          GOOGLE_API_KEY: test-only
          PINECONE_API_KEY: test-only
          PINECONE_INDEX: sheldonbrain-rag-test
        run: pytest tests/test_governance_contract.py -q
