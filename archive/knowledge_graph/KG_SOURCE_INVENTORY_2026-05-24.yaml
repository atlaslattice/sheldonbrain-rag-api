# Knowledge Graph Source Inventory
# Date: 2026-05-24
# Status: seeded clipboard, not canon
# Doctrine: source presence is not ratification; retrieved chunk is not fact; memory is not authority.

inventory_version: "0.1"
created_at: "2026-05-24"
updated_at: "2026-05-24"
status: "seeded_not_canon"
product_invariant: "memory != permission"

surfaces:
  GitHub:
    role: "durable artifact / receipt substrate"
  Drive:
    role: "raw and semi-raw document archive"
  Notion:
    role: "legacy knowledge / structured workspace archive"
  OpenAI:
    role: "extraction, graph-building, review, evals, and agentic workflow layer"
  HumanRoot:
    role: "final authority gate"

source_inventory_record_schema:
  source_id: "Stable local ID for graph intake"
  title: "Human-readable artifact title"
  surface: "GitHub | Drive | Notion | Uploaded | Unknown"
  url_or_path: "Resolvable URL or repo path when known"
  file_type: "markdown | yaml | pdf | transcript | issue | pull_request | folder | unknown"
  created_or_modified: "Known timestamp, or unresolved"
  raw_export_status: "present | missing | wrapper_only | unresolved"
  sha256_status: "present | missing | unresolved"
  source_class: "raw | semi_raw | parsed | review | canon_candidate | legacy | wrapper | unknown"
  related_lane: "Rootglass | Lucerna | Hashlight | TIDELOCK | AtlasBrain | Sable Vesper | Morpheus Grok | Claude | General"
  review_priority: "P0 | P1 | P2 | P3"
  mirrored_to_github: "yes | no | partial | unresolved"
  missing_receipts: []
  notes: "Freeform intake notes"

